<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Thirty marbles are divided into five equal parts. Each of the five sections is labelled 6. Thirty divided by five is six."><title>Find one part first</title><desc>Thirty marbles are divided into five equal parts. Each of the five sections is labelled 6. Thirty divided by five is six.</desc><rect width="480" height="320" rx="18" fill="#fbf8f1"/><text x="240" y="42" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">First find one part</text><path d="M30 114 V105 H450 V114" fill="none" stroke="#537262" stroke-width="2.5"/><text x="240.0" y="86" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#193e33" text-anchor="middle">30 marbles</text><rect x="30.0" y="125" width="84.0" height="72" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="1"/><text x="72.0" y="172.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="114.0" y="125" width="84.0" height="72" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="2"/><text x="156.0" y="172.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="198.0" y="125" width="84.0" height="72" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="3"/><text x="240.0" y="172.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="282.0" y="125" width="84.0" height="72" rx="0" fill="#ffffff" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="4"/><text x="324.0" y="172.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="366.0" y="125" width="84.0" height="72" rx="0" fill="#ffffff" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="5"/><text x="408.0" y="172.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><text x="240" y="254" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" fill="#193e33" text-anchor="middle">30 ÷ 5 = 6</text><text x="240" y="302" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#193e33" text-anchor="middle">6 in every part</text></svg>