<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Meet the fraction</title><desc id="desc">A ribbon with 3 of 5 equal parts coloured aligns with a number line. Point P is 3/5 of the distance from zero to one.</desc><rect width="480" height="320" fill="#fffbf5"/><g data-role="parts" data-parts="5" data-shaded="3"><rect class="part" data-index="0" x="40" y="48" width="80" height="52" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="1" x="120" y="48" width="80" height="52" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="2" x="200" y="48" width="80" height="52" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="3" x="280" y="48" width="80" height="52" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="4" x="360" y="48" width="80" height="52" fill="#ffffff" stroke="#203833" stroke-width="2.5"/></g><line x1="280" y1="102" x2="280" y2="185" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 6"/><text x="280.0" y="161" font-size="28" text-anchor="middle" fill="#203833" font-weight="600">P</text><line x1="40" y1="195" x2="440" y2="195" stroke="#203833" stroke-width="3" /><line x1="40" y1="195" x2="280" y2="195" stroke="#0f766e" stroke-width="7" /><line x1="40" y1="184" x2="40" y2="206" stroke="#203833" stroke-width="3" data-role="tick"/><line x1="120" y1="184" x2="120" y2="206" stroke="#203833" stroke-width="3" data-role="tick"/><line x1="200" y1="184" x2="200" y2="206" stroke="#203833" stroke-width="3" data-role="tick"/><line x1="280" y1="184" x2="280" y2="206" stroke="#203833" stroke-width="3" data-role="tick"/><line x1="360" y1="184" x2="360" y2="206" stroke="#203833" stroke-width="3" data-role="tick"/><line x1="440" y1="184" x2="440" y2="206" stroke="#203833" stroke-width="3" data-role="tick"/><circle cx="280" cy="195" r="8" fill="#0f766e" data-role="fraction-point" data-tick="3"/><text x="40" y="250" font-size="30" text-anchor="middle" fill="#203833" font-weight="600">0</text><text x="440" y="250" font-size="30" text-anchor="middle" fill="#203833" font-weight="600">1</text><text x="280.0" y="250" font-size="36" text-anchor="middle" fill="#203833" font-weight="600">3/5</text><text x="240" y="300" font-size="26" text-anchor="middle" fill="#203833" font-weight="600">Count spaces from 0</text></svg>