<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Three of five sections, each worth 6, are highlighted. Their total is 18 marbles. Checking 18 divided by 3, then multiplied by 5, returns 30."><title>Combine and check</title><desc>Three of five sections, each worth 6, are highlighted. Their total is 18 marbles. Checking 18 divided by 3, then multiplied by 5, returns 30.</desc><rect width="480" height="320" rx="18" fill="#fbf8f1"/><text x="240" y="40" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">Then take 3 parts</text><rect x="30.0" y="71" width="84.0" height="66" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="1"/><text x="72.0" y="115.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="114.0" y="71" width="84.0" height="66" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="2"/><text x="156.0" y="115.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="198.0" y="71" width="84.0" height="66" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="3"/><text x="240.0" y="115.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="282.0" y="71" width="84.0" height="66" rx="0" fill="#ffffff" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="4"/><text x="324.0" y="115.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="366.0" y="71" width="84.0" height="66" rx="0" fill="#ffffff" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="5"/><text x="408.0" y="115.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><path d="M30 155 V164 H282.0 V155" fill="none" stroke="#537262" stroke-width="2.5"/><text x="156.0" y="199" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#193e33" text-anchor="middle">18 marbles</text><text x="240" y="246" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" fill="#193e33" text-anchor="middle">6 × 3 = 18</text><text x="240" y="297" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#193e33" text-anchor="middle">Check: 18 ÷ 3 × 5 = 30</text></svg>