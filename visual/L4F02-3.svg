<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Six sections of 7 cm make 42 cm. The calculation is 7 times 6 equals 42. Dividing 42 by 6 gives 7 again."><title>Build the whole and check</title><desc>Six sections of 7 cm make 42 cm. The calculation is 7 times 6 equals 42. Dividing 42 by 6 gives 7 again.</desc><rect width="480" height="320" rx="18" fill="#fbf8f1"/><text x="240" y="39" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">Build the whole</text><rect x="30.0" y="68" width="70.0" height="64" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="1"/><text x="65.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">7</text><rect x="100.0" y="68" width="70.0" height="64" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="2"/><text x="135.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">7</text><rect x="170.0" y="68" width="70.0" height="64" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="3"/><text x="205.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">7</text><rect x="240.0" y="68" width="70.0" height="64" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="4"/><text x="275.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">7</text><rect x="310.0" y="68" width="70.0" height="64" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="5"/><text x="345.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">7</text><rect x="380.0" y="68" width="70.0" height="64" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="6"/><text x="415.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">7</text><path d="M30 149 V158 H450 V149" fill="none" stroke="#537262" stroke-width="2.5"/><text x="240.0" y="193" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">42 cm</text><text x="240" y="241" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#193e33" text-anchor="middle">7 × 6 = 42 cm</text><text x="240" y="292" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#193e33" text-anchor="middle">Check: 42 ÷ 6 = 7 cm</text></svg>