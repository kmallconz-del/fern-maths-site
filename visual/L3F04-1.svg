<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc" data-lesson="L3F04" data-frame="L3F04-1" font-family="Arial, sans-serif"><title id="title">Keep the whole</title><desc id="desc">One uncut white paper strip. A bracket spans the full original length.</desc><rect width="480" height="320" fill="#fffbf5"/><text x="240" y="44" font-size="32" fill="#203833" text-anchor="middle" >One whole</text><path d="M40 83 V70 H440 V83" fill="none" stroke="#203833" stroke-width="2.5"/><rect x="40" y="106" width="400" height="100" rx="5" fill="#ffffff" stroke="#203833" stroke-width="3"/><text x="240" y="272" font-size="32" fill="#203833" text-anchor="middle" >A paper strip</text></svg>