<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Write the comparison</title><desc id="desc">The same equal-sized ribbons show 3/8 and 5/8. The relationship below is 3/8 &lt; 5/8.</desc><rect width="480" height="320" fill="#fffbf5"/><text x="29" y="92" font-size="28" text-anchor="middle" fill="#203833" font-weight="600">A</text><g data-role="ribbon-A" data-parts="8" data-shaded="3"><rect class="part" data-index="0" x="64" y="58" width="48" height="52" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="1" x="112" y="58" width="48" height="52" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="2" x="160" y="58" width="48" height="52" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="3" x="208" y="58" width="48" height="52" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="4" x="256" y="58" width="48" height="52" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="5" x="304" y="58" width="48" height="52" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="6" x="352" y="58" width="48" height="52" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="7" x="400" y="58" width="48" height="52" fill="#ffffff" stroke="#203833" stroke-width="2.5"/></g><text x="260" y="145" font-size="32" text-anchor="middle" fill="#203833" font-weight="600">3/8</text><text x="29" y="191" font-size="28" text-anchor="middle" fill="#203833" font-weight="600">B</text><g data-role="ribbon-B" data-parts="8" data-shaded="5"><rect class="part" data-index="0" x="64" y="157" width="48" height="52" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="1" x="112" y="157" width="48" height="52" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="2" x="160" y="157" width="48" height="52" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="3" x="208" y="157" width="48" height="52" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="4" x="256" y="157" width="48" height="52" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="5" x="304" y="157" width="48" height="52" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="6" x="352" y="157" width="48" height="52" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="7" x="400" y="157" width="48" height="52" fill="#ffffff" stroke="#203833" stroke-width="2.5"/></g><text x="260" y="244" font-size="32" text-anchor="middle" fill="#203833" font-weight="600">5/8</text><text x="240" y="302" font-size="36" text-anchor="middle" fill="#203833" font-weight="600">3/8 &lt; 5/8</text></svg>