<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="All five equal sections are labelled 6. They make 30 cm. The check divides 30 by 5, then multiplies by 3, giving the original 18 cm."><title>Rebuild and check</title><desc>All five equal sections are labelled 6. They make 30 cm. The check divides 30 by 5, then multiplies by 3, giving the original 18 cm.</desc><rect width="480" height="320" rx="18" fill="#fbf8f1"/><text x="240" y="40" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">Rebuild all 5 parts</text><rect x="30.0" y="70" width="84.0" height="66" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="1"/><text x="72.0" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="114.0" y="70" width="84.0" height="66" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="2"/><text x="156.0" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="198.0" y="70" width="84.0" height="66" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="3"/><text x="240.0" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="282.0" y="70" width="84.0" height="66" rx="0" fill="#efdfb9" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="4"/><text x="324.0" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="366.0" y="70" width="84.0" height="66" rx="0" fill="#efdfb9" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="5"/><text x="408.0" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><path d="M30 154 V163 H450 V154" fill="none" stroke="#537262" stroke-width="2.5"/><text x="240.0" y="198" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">30 cm</text><text x="240" y="245" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#193e33" text-anchor="middle">6 × 5 = 30 cm</text><text x="240" y="297" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#193e33" text-anchor="middle">Check: 30 ÷ 5 × 3 = 18 cm</text></svg>