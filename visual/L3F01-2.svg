<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Make equal parts</title><desc id="desc">The same ribbon is divided into 5 equal parts. The first 3 are teal.</desc><rect width="480" height="320" fill="#fffbf5"/><text x="240" y="52" font-size="30" text-anchor="middle" fill="#203833" font-weight="600">5 equal parts</text><g data-role="parts" data-parts="5" data-shaded="3"><rect class="part" data-index="0" x="40" y="105" width="80" height="72" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="1" x="120" y="105" width="80" height="72" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="2" x="200" y="105" width="80" height="72" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="3" x="280" y="105" width="80" height="72" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="4" x="360" y="105" width="80" height="72" fill="#ffffff" stroke="#203833" stroke-width="2.5"/></g><line x1="40" y1="207" x2="280" y2="207" stroke="#0f766e" stroke-width="4" /><line x1="40" y1="199" x2="40" y2="215" stroke="#0f766e" stroke-width="4" /><line x1="280" y1="199" x2="280" y2="215" stroke="#0f766e" stroke-width="4" /><text x="160.0" y="255" font-size="28" text-anchor="middle" fill="#203833" font-weight="600">3 coloured parts</text></svg>