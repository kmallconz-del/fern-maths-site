<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Compare these ribbons</title><desc id="desc">Two equal-sized ribbons each have four equal parts. Ribbon A has three coloured parts. Ribbon B has two coloured parts.</desc><rect width="480" height="320" fill="#fffbf5"/><text x="240" y="46" font-size="28" text-anchor="middle" fill="#203833" font-weight="600">Same-sized ribbons</text><text x="29" y="122" font-size="30" text-anchor="middle" fill="#203833" font-weight="600">A</text><g data-role="ribbon-A" data-parts="4" data-shaded="3"><rect class="part" data-index="0" x="64" y="87" width="96" height="58" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="1" x="160" y="87" width="96" height="58" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="2" x="256" y="87" width="96" height="58" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="3" x="352" y="87" width="96" height="58" fill="#ffffff" stroke="#203833" stroke-width="2.5"/></g><text x="29" y="240" font-size="30" text-anchor="middle" fill="#203833" font-weight="600">B</text><g data-role="ribbon-B" data-parts="4" data-shaded="2"><rect class="part" data-index="0" x="64" y="205" width="96" height="58" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="1" x="160" y="205" width="96" height="58" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="2" x="256" y="205" width="96" height="58" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="3" x="352" y="205" width="96" height="58" fill="#ffffff" stroke="#203833" stroke-width="2.5"/></g></svg>