<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="One group of seven counters represents one sixth of 42. The equations are 42 divided by 6 equals 7, and 7 times 6 equals 42."><title>Take one and check</title><desc>One group of seven counters represents one sixth of 42. The equations are 42 divided by 6 equals 7, and 7 times 6 equals 42.</desc><rect width="480" height="320" rx="18" fill="#fbf8f1"/><text x="240" y="40" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#193e33" text-anchor="middle">One sixth = one group</text><g data-role="equal-group" data-count="7"><rect x="32" y="70" width="128" height="94" rx="12" fill="#d8e9dc" stroke="#537262" stroke-width="3" /><circle cx="63" cy="91" r="6.5" fill="#2e7658" data-role="counter"/><circle cx="96" cy="91" r="6.5" fill="#2e7658" data-role="counter"/><circle cx="129" cy="91" r="6.5" fill="#2e7658" data-role="counter"/><circle cx="63" cy="114" r="6.5" fill="#2e7658" data-role="counter"/><circle cx="96" cy="114" r="6.5" fill="#2e7658" data-role="counter"/><circle cx="129" cy="114" r="6.5" fill="#2e7658" data-role="counter"/><circle cx="96" cy="137" r="6.5" fill="#2e7658" data-role="counter"/></g><text x="313" y="123" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#193e33" text-anchor="middle">42 ÷ 6 = 7</text><rect x="30" y="194" width="420" height="101" rx="14" fill="#d8e9dc" stroke="#d8e9dc" stroke-width="2" /><text x="240" y="230" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#193e33" text-anchor="middle">Check the whole</text><text x="240" y="273" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" fill="#193e33" text-anchor="middle">7 × 6 = 42</text></svg>