<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Same-sized wholes</title><desc id="desc">Ribbons A and B have exactly the same length and width. Neither is cut.</desc><rect width="480" height="320" fill="#fffbf5"/><text x="240" y="48" font-size="30" text-anchor="middle" fill="#203833" font-weight="600">Same-sized wholes</text><text x="29" y="119" font-size="30" text-anchor="middle" fill="#203833" font-weight="600">A</text><rect class="whole" x="64" y="83" width="384" height="62" fill="#e6f0ec" stroke="#203833" stroke-width="2.5"/><text x="29" y="235" font-size="30" text-anchor="middle" fill="#203833" font-weight="600">B</text><rect class="whole" x="64" y="199" width="384" height="62" fill="#e6f0ec" stroke="#203833" stroke-width="2.5"/></svg>