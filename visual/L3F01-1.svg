<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">One whole ribbon</title><desc id="desc">One uncut ribbon. Its left end is zero and its right end is one.</desc><rect width="480" height="320" fill="#fffbf5"/><text x="240" y="66" font-size="32" text-anchor="middle" fill="#203833" font-weight="600">One whole</text><rect class="whole" x="40" y="115" width="400" height="72" fill="#e6f0ec" stroke="#203833" stroke-width="2.5"/><text x="40" y="240" font-size="32" text-anchor="middle" fill="#203833" font-weight="600">0</text><text x="440" y="240" font-size="32" text-anchor="middle" fill="#203833" font-weight="600">1</text></svg>