<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="The same 18 cm bracket covers three equal parts, now each labelled 6. Dividing 18 by 3 finds one part of 6 cm."><title>Split the known amount</title><desc>The same 18 cm bracket covers three equal parts, now each labelled 6. Dividing 18 by 3 finds one part of 6 cm.</desc><rect width="480" height="320" rx="18" fill="#fbf8f1"/><text x="240" y="42" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">Find one equal part</text><path d="M30 117 V108 H282.0 V117" fill="none" stroke="#537262" stroke-width="2.5"/><text x="156.0" y="88" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">18 cm</text><rect x="30.0" y="128" width="84.0" height="76" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="1"/><text x="72.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="114.0" y="128" width="84.0" height="76" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="2"/><text x="156.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="198.0" y="128" width="84.0" height="76" rx="0" fill="#d8e9dc" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="3"/><text x="240.0" y="177.0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#193e33" text-anchor="middle">6</text><rect x="282.0" y="128" width="84.0" height="76" rx="0" fill="#ffffff" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="4"/><rect x="366.0" y="128" width="84.0" height="76" rx="0" fill="#ffffff" stroke="#537262" stroke-width="2" data-role="equal-part" data-part-index="5"/><text x="240" y="275" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" fill="#193e33" text-anchor="middle">18 ÷ 3 = 6 cm</text></svg>