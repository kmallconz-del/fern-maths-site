<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc" style="font-family:Arial,Helvetica,sans-serif"><title id="title">Compare equal parts</title><desc id="desc">Both ribbons have 8 equal parts. Ribbon A has 3 teal parts; ribbon B has 5 yellow parts.</desc><rect width="480" height="320" fill="#fffbf5"/><text x="240" y="40" font-size="28" text-anchor="middle" fill="#203833" font-weight="600">8 equal parts each</text><text x="29" y="109" font-size="28" text-anchor="middle" fill="#203833" font-weight="600">A</text><g data-role="ribbon-A" data-parts="8" data-shaded="3"><rect class="part" data-index="0" x="64" y="76" width="48" height="54" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="1" x="112" y="76" width="48" height="54" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="2" x="160" y="76" width="48" height="54" fill="#0f766e" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="3" x="208" y="76" width="48" height="54" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="4" x="256" y="76" width="48" height="54" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="5" x="304" y="76" width="48" height="54" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="6" x="352" y="76" width="48" height="54" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="7" x="400" y="76" width="48" height="54" fill="#ffffff" stroke="#203833" stroke-width="2.5"/></g><text x="260" y="164" font-size="26" text-anchor="middle" fill="#203833" font-weight="600">3 coloured parts</text><text x="29" y="224" font-size="28" text-anchor="middle" fill="#203833" font-weight="600">B</text><g data-role="ribbon-B" data-parts="8" data-shaded="5"><rect class="part" data-index="0" x="64" y="191" width="48" height="54" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="1" x="112" y="191" width="48" height="54" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="2" x="160" y="191" width="48" height="54" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="3" x="208" y="191" width="48" height="54" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="4" x="256" y="191" width="48" height="54" fill="#f3c969" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="5" x="304" y="191" width="48" height="54" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="6" x="352" y="191" width="48" height="54" fill="#ffffff" stroke="#203833" stroke-width="2.5"/><rect class="part" data-index="7" x="400" y="191" width="48" height="54" fill="#ffffff" stroke="#203833" stroke-width="2.5"/></g><text x="260" y="280" font-size="26" text-anchor="middle" fill="#203833" font-weight="600">5 coloured parts</text></svg>