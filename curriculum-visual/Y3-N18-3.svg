<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Same amount, new name</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><rect x="50.0" y="80" width="90.0" height="70" fill="#087e75" stroke="#183f38" stroke-width="2"/><rect x="140.0" y="80" width="90.0" height="70" fill="#087e75" stroke="#183f38" stroke-width="2"/><rect x="230.0" y="80" width="90.0" height="70" fill="#087e75" stroke="#183f38" stroke-width="2"/><rect x="320.0" y="80" width="90.0" height="70" fill="white" stroke="#183f38" stroke-width="2"/><rect x="410.0" y="80" width="90.0" height="70" fill="white" stroke="#183f38" stroke-width="2"/><rect x="500.0" y="80" width="90.0" height="70" fill="white" stroke="#183f38" stroke-width="2"/><text x="320" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">3/6 = 1/2</text><rect x="50.0" y="240" width="90.0" height="60" fill="#087e75" stroke="#183f38" stroke-width="2"/><rect x="140.0" y="240" width="90.0" height="60" fill="#087e75" stroke="#183f38" stroke-width="2"/><rect x="230.0" y="240" width="90.0" height="60" fill="#087e75" stroke="#183f38" stroke-width="2"/><rect x="320.0" y="240" width="90.0" height="60" fill="#087e75" stroke="#183f38" stroke-width="2"/><rect x="410.0" y="240" width="90.0" height="60" fill="#087e75" stroke="#183f38" stroke-width="2"/><rect x="500.0" y="240" width="90.0" height="60" fill="#087e75" stroke="#183f38" stroke-width="2"/><text x="320" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">6/6 = 1</text></svg>