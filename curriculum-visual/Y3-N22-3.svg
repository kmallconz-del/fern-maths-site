<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Combine different values</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><rect x="35.0" y="100" width="285.0" height="64" fill="#d9eee3" stroke="#183f38" stroke-width="2"/><text x="177.5" y="141.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">$5</text><rect x="320.0" y="100" width="285.0" height="64" fill="#d9eee3" stroke="#183f38" stroke-width="2"/><text x="462.5" y="141.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">3 × $2</text><rect x="35.0" y="164" width="285.0" height="64" fill="white" stroke="#183f38" stroke-width="2"/><text x="177.5" y="205.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">5</text><rect x="320.0" y="164" width="285.0" height="64" fill="white" stroke="#183f38" stroke-width="2"/><text x="462.5" y="205.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">6</text><text x="320" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">5 + 6 = 11 dollars</text></svg>