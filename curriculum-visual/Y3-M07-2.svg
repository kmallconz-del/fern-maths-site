<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Count the time between</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><line x1="60" y1="215" x2="580" y2="215" stroke="#183f38" stroke-width="3"/><line x1="60.0" y1="204" x2="60.0" y2="227" stroke="#183f38" stroke-width="3"/><line x1="190.0" y1="204" x2="190.0" y2="227" stroke="#183f38" stroke-width="3"/><line x1="320.0" y1="204" x2="320.0" y2="227" stroke="#183f38" stroke-width="3"/><line x1="450.0" y1="204" x2="450.0" y2="227" stroke="#183f38" stroke-width="3"/><line x1="580.0" y1="204" x2="580.0" y2="227" stroke="#183f38" stroke-width="3"/><circle cx="146.67" cy="215" r="10" fill="#087e75"/><text x="146.67" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">start</text><circle cx="276.67" cy="215" r="10" fill="#087e75"/><text x="276.67" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">+15</text><circle cx="363.33" cy="215" r="10" fill="#087e75"/><text x="363.33" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">+10</text><text x="320" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">15 + 10 = 25 minutes</text></svg>