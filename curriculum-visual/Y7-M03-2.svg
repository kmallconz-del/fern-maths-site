<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>A triangle is half</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><text x="320" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">A triangle is half</text><rect x="170" y="100" width="300" height="200" fill="#d9eee3" stroke="#183f38" stroke-width="2"/><polygon points="170,300 470,300 170,100" fill="#f5ce75" stroke="#183f38" stroke-width="3"/><text x="320" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">A = ½ × base × height</text></svg>