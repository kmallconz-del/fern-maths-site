<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Know one equal part</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><rect x="45.0" y="70" width="550.0" height="120" fill="#d9eee3" stroke="#183f38" stroke-width="2"/><circle cx="300.0" cy="130.0" r="7" fill="#087e75"/><circle cx="320.0" cy="130.0" r="7" fill="#087e75"/><circle cx="340.0" cy="130.0" r="7" fill="#087e75"/><text x="320" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">1/4 of the whole = 3</text></svg>