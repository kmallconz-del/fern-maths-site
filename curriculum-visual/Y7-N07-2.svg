<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Fractions are division</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><text x="320" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">Fractions are division</text><line x1="55" y1="210" x2="585" y2="210" stroke="#183f38" stroke-width="3"/><line x1="55.0" y1="200" x2="55.0" y2="220" stroke="#183f38" stroke-width="3"/><text x="55.0" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#183f38">0</text><line x1="187.5" y1="200" x2="187.5" y2="220" stroke="#183f38" stroke-width="3"/><text x="187.5" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#183f38">0.25</text><line x1="320.0" y1="200" x2="320.0" y2="220" stroke="#183f38" stroke-width="3"/><text x="320.0" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#183f38">0.5</text><line x1="452.5" y1="200" x2="452.5" y2="220" stroke="#183f38" stroke-width="3"/><text x="452.5" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#183f38">0.75</text><line x1="585.0" y1="200" x2="585.0" y2="220" stroke="#183f38" stroke-width="3"/><text x="585.0" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#183f38">1</text><circle cx="452.5" cy="210" r="8" fill="#087e75"/><text x="452.5" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">3/4 = 0.75</text><text x="320" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">75/100 = 75%</text></svg>