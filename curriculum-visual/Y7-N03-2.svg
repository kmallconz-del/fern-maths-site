<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>The greatest shared factor</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><text x="320" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">The greatest shared factor</text><rect x="35.0" y="125" width="285.0" height="95" fill="#d9eee3" stroke="#183f38" stroke-width="2"/><text x="177.5" y="186.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">12 factors</text><rect x="320.0" y="125" width="285.0" height="95" fill="#d9eee3" stroke="#183f38" stroke-width="2"/><text x="462.5" y="186.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">18 factors</text><rect x="35.0" y="220" width="285.0" height="95" fill="white" stroke="#183f38" stroke-width="2"/><text x="177.5" y="281.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="26.82" font-weight="600" fill="#183f38">1, 2, 3, 4, 6, 12</text><rect x="320.0" y="220" width="285.0" height="95" fill="white" stroke="#183f38" stroke-width="2"/><text x="462.5" y="281.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="26.82" font-weight="600" fill="#183f38">1, 2, 3, 6, 9, 18</text><circle cx="320" cy="330" r="11" fill="#087e75"/></svg>