<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Check both sides</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><rect x="35.0" y="100" width="285.0" height="64" fill="#d9eee3" stroke="#183f38" stroke-width="2"/><text x="177.5" y="141.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">Left side</text><rect x="320.0" y="100" width="285.0" height="64" fill="#d9eee3" stroke="#183f38" stroke-width="2"/><text x="462.5" y="141.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">Right side</text><rect x="35.0" y="164" width="285.0" height="64" fill="white" stroke="#183f38" stroke-width="2"/><text x="177.5" y="205.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">17 + 13</text><rect x="320.0" y="164" width="285.0" height="64" fill="white" stroke="#183f38" stroke-width="2"/><text x="462.5" y="205.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">30</text><text x="320" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="600" fill="#183f38">30 = 30</text></svg>