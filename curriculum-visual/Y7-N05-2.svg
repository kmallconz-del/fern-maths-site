<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Split a multiplication</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><text x="320" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">Split a multiplication</text><rect x="130" y="110" width="360" height="120" fill="#d9eee3" stroke="#183f38" stroke-width="2"/><rect x="130" y="230" width="360" height="55" fill="#f5ce75" stroke="#183f38" stroke-width="2"/><text x="320" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">24 × 10 = 240</text><text x="320" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">24 × 3 = 72</text><text x="320" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">240 + 72 = 312</text></svg>