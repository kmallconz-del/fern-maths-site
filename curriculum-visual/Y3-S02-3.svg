<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Dots can show frequency</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><text x="320" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">Travel to school</text><text x="320" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#183f38">1 dot = 1 child</text><circle cx="120" cy="285" r="10" fill="#087e75"/><circle cx="120" cy="260" r="10" fill="#087e75"/><circle cx="120" cy="235" r="10" fill="#087e75"/><circle cx="120" cy="210" r="10" fill="#087e75"/><text x="120" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">Walk</text><circle cx="320" cy="285" r="10" fill="#087e75"/><circle cx="320" cy="260" r="10" fill="#087e75"/><text x="320" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">Bus</text><circle cx="520" cy="285" r="10" fill="#087e75"/><circle cx="520" cy="260" r="10" fill="#087e75"/><circle cx="520" cy="235" r="10" fill="#087e75"/><text x="520" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">Bike</text><line x1="65" y1="310" x2="585" y2="310" stroke="#183f38" stroke-width="3"/></svg>