<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>A straight angle</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><text x="320" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">A straight angle</text><line x1="110" y1="270" x2="535" y2="270" stroke="#183f38" stroke-width="3"/><line x1="320" y1="270" x2="379.85" y2="105.55" stroke="#183f38" stroke-width="3"/><text x="220" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">110°</text><text x="419" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">70°</text><text x="320" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">110° + 70° = 180°</text></svg>