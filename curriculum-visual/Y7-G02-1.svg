<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>A full turn is 360°</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><text x="320" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">A full turn is 360°</text><rect x="205" y="105" width="220" height="220" fill="#d9eee3" stroke="#183f38" stroke-width="2"/><line x1="425" y1="325" x2="545" y2="325" stroke="#087e75" stroke-width="4"/><line x1="425" y1="105" x2="425" y2="60" stroke="#087e75" stroke-width="4"/><text x="480" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">90°</text><text x="320" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#183f38">4 × 90° = 360°</text></svg>