<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>The remainder is shared</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><text x="320" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">The remainder is shared</text><rect x="50.0" y="150" width="108.0" height="82" fill="#087e75" stroke="#183f38" stroke-width="2"/><rect x="158.0" y="150" width="108.0" height="82" fill="#087e75" stroke="#183f38" stroke-width="2"/><rect x="266.0" y="150" width="108.0" height="82" fill="white" stroke="#183f38" stroke-width="2"/><rect x="374.0" y="150" width="108.0" height="82" fill="white" stroke="#183f38" stroke-width="2"/><rect x="482.0" y="150" width="108.0" height="82" fill="white" stroke="#183f38" stroke-width="2"/><text x="320" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">2 ÷ 5 = 2/5 = 0.4</text></svg>