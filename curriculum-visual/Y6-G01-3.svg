<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Angles explain relationships</title><rect width="640" height="400" rx="18" fill="#fffaf1"/><text x="320" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">Angles explain relationships</text><polygon points="160,110 480,110 525,300 120,300" fill="#d9eee3" stroke="#183f38" stroke-width="3"/><line x1="160" y1="110" x2="525" y2="300" stroke="#087e75" stroke-width="4"/><text x="320" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#183f38">180° + 180° = 360°</text></svg>